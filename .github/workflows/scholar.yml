name: Update Scholar Data

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  update-scholar:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@v3

      - name: Install dependencies
        run: pip install scholarly

      - name: Fetch scholar data
        run: python scholar_update.py

      - name: Commit updates
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add publications.json citations.json scholar-stats.json
          git commit -m "Update scholar data" || echo "No changes"
          git push